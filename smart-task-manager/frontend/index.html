<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Manager</title>
  <!-- Our own stylesheet. No frameworks, no build step, just plain CSS. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="app-header">
    <div class="container">
      <h1>Smart Task Manager</h1>
      <p class="subtitle">A simple dashboard for tracking your tasks</p>
    </div>
  </header>

  <main class="container">

    <!-- A place to show error messages from the backend instead of alert() popups. -->
    <div id="error-banner" class="error-banner hidden"></div>

    <!-- ===================== STATISTICS PANEL ===================== -->
    <section class="card stats-panel" aria-label="Task statistics">
      <h2>Statistics</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-number" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="stat-pending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="stat-in-progress">0</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="stat-completed">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="stat-high-priority">0</span>
          <span class="stat-label">High Priority</span>
        </div>
      </div>
    </section>

    <!-- ===================== ADD / EDIT TASK FORM ===================== -->
    <section class="card">
      <h2 id="form-heading">Add a New Task</h2>
      <!-- We use one single <form> for BOTH creating and editing tasks.
           JavaScript decides whether we are creating or editing based on
           whether "editingTaskId" (see app.js) currently holds a task id. -->
      <form id="task-form">
        <div class="form-row">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" name="title" placeholder="e.g. Finish JavaScript homework" required />
        </div>

        <div class="form-row">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" rows="3" placeholder="Any extra details about the task..."></textarea>
        </div>

        <div class="form-row form-row-split">
          <div>
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div>
            <label for="task-status">Status</label>
            <select id="task-status" name="status">
              <option value="Pending" selected>Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div>
            <label for="task-deadline">Deadline</label>
            <input type="date" id="task-deadline" name="deadline" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="btn btn-primary">Save Task</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-link hidden">Cancel edit</button>
        </div>
      </form>
    </section>

    <!-- ===================== SEARCH & FILTER BAR ===================== -->
    <section class="card filter-bar">
      <div class="form-row">
        <label for="search-input">Search</label>
        <input type="text" id="search-input" placeholder="Search by title or description..." />
      </div>

      <div class="form-row form-row-split">
        <div>
          <label for="filter-priority">Priority</label>
          <select id="filter-priority">
            <option value="">All</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <div>
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">All</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ===================== TASK LIST ===================== -->
    <section class="task-list-section">
      <h2>Your Tasks</h2>
      <!-- app.js will fill this div with task "cards", one per task. -->
      <div id="task-list" class="task-list"></div>

      <!-- Shown only when there are zero tasks to display. -->
      <p id="empty-state" class="empty-state hidden">No tasks found. Try adjusting your filters or add a new task above.</p>
    </section>

  </main>

  <!-- Loading app.js with "defer" means: download it in the background,
       but only RUN it after the whole HTML page has been parsed.
       That way every element above already exists when our JS looks for it. -->
  <script src="app.js" defer></script>
</body>
</html>
